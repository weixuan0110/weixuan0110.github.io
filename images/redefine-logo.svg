<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Perfect square background -->
  <rect x="50" y="50" width="300" height="300" fill="url(#bgGradient)" stroke="#00ff66" stroke-width="3"/>
  
  <!-- Inner border - also square -->
  <rect x="70" y="70" width="260" height="260" fill="none" stroke="#aa00ff" stroke-width="1.5" stroke-dasharray="5,3" stroke-opacity="0.7"/>
  
  <!-- Binary code background pattern -->
  <g font-family="'Courier New', monospace" font-size="10" opacity="0.5">
    <text x="100" y="100" fill="#00ff66">01001100 01101111 01100111</text>
    <text x="100" y="115" fill="#aa00ff">01010111 01011111 00110001</text>
    <text x="100" y="130" fill="#00ff66">01001100 00110001 00110011</text>
    <text x="100" y="145" fill="#aa00ff">01010100 00110011 00110111</text>
    <text x="100" y="330" fill="#00ff66">01001000 01100001 01100011</text>
    <text x="100" y="345" fill="#aa00ff">01101011 00110011 01110010</text>
    <text x="100" y="360" fill="#00ff66">01000011 01010100 01000110</text>
  </g>
  
  <!-- Vertical binary -->
  <g font-family="'Courier New', monospace" font-size="10" opacity="0.5">
    <text x="90" y="190" fill="#00ff66" transform="rotate(90, 90, 190)">10101010</text>
    <text x="105" y="190" fill="#aa00ff" transform="rotate(90, 105, 190)">01010101</text>
    <text x="90" y="260" fill="#00ff66" transform="rotate(90, 90, 260)">11001100</text>
    <text x="105" y="260" fill="#aa00ff" transform="rotate(90, 105, 260)">00110011</text>
    <text x="310" y="190" fill="#00ff66" transform="rotate(270, 310, 190)">10101010</text>
    <text x="325" y="190" fill="#aa00ff" transform="rotate(270, 325, 190)">01010101</text>
    <text x="310" y="260" fill="#00ff66" transform="rotate(270, 310, 260)">11001100</text>
    <text x="325" y="260" fill="#aa00ff" transform="rotate(270, 325, 260)">00110011</text>
  </g>
  
  <!-- Central square with w_11 -->
  <rect x="120" y="120" width="160" height="160" fill="rgba(0,0,0,0.7)" stroke="#00ff66" stroke-width="2"/>
  
  <!-- 1337 styled elements -->
  <text x="200" y="200" font-family="'Arial', sans-serif" font-weight="bold" font-size="56" fill="#ffffff" text-anchor="middle" filter="url(#textGlow)">w_11</text>
  <text x="200" y="230" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#aa00ff" text-anchor="middle">1337 h4x0r</text>
  <text x="200" y="250" font-family="'Courier New', monospace" font-size="16" fill="#00ff66" text-anchor="middle">C7F pl4y3r</text>
  
  <!-- Corner hacker symbols -->
  <text x="80" y="90" font-family="'Courier New', monospace" font-size="18" fill="#00ff66">/*</text>
  <text x="320" y="90" font-family="'Courier New', monospace" font-size="18" fill="#00ff66" text-anchor="end">*/</text>
  <text x="80" y="330" font-family="'Courier New', monospace" font-size="18" fill="#00ff66">/*</text>
  <text x="320" y="330" font-family="'Courier New', monospace" font-size="18" fill="#00ff66" text-anchor="end">*/</text>
  
  <!-- Lock icon in leet style -->
  <g transform="translate(155, 280)">
    <rect x="0" y="0" width="30" height="25" rx="3" fill="none" stroke="#00ff66" stroke-width="1.5" />
    <path d="M7.5 0 V-10 A7.5,7.5 0 0 1 22.5,-10 V0" fill="none" stroke="#00ff66" stroke-width="1.5" />
    <text x="15" y="17" font-family="'Courier New', monospace" font-size="14" fill="#00ff66" text-anchor="middle">$</text>
  </g>
  
  <!-- Flag icon in leet style -->
  <g transform="translate(215, 280)">
    <polygon points="0,0 30,0 30,10 15,15 30,20 30,30 0,30" fill="none" stroke="#aa00ff" stroke-width="1.5" />
    <text x="15" y="20" font-family="'Courier New', monospace" font-size="14" fill="#aa00ff" text-anchor="middle">F</text>
  </g>
  
  <!-- Circuit connector lines -->
  <path d="M120 200 H50 M280 200 H350" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M200 120 V50 M200 280 V350" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.8" />
  
  <!-- Matrix-like falling codes at corners -->
  <g font-family="'Courier New', monospace" font-size="12" opacity="0.8">
    <text x="70" y="130" fill="#00ff66">1</text>
    <text x="70" y="145" fill="#00ff66">0</text>
    <text x="70" y="160" fill="#00ff66">1</text>
    <text x="330" y="130" fill="#00ff66">0</text>
    <text x="330" y="145" fill="#00ff66">1</text>
    <text x="330" y="160" fill="#00ff66">0</text>
    <text x="70" y="250" fill="#00ff66">0</text>
    <text x="70" y="265" fill="#00ff66">1</text>
    <text x="70" y="280" fill="#00ff66">0</text>
    <text x="330" y="250" fill="#00ff66">1</text>
    <text x="330" y="265" fill="#00ff66">0</text>
    <text x="330" y="280" fill="#00ff66">1</text>
  </g>
</svg>
