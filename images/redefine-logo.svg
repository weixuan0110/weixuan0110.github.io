<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Shield outline (cybersecurity symbol) -->
  <path d="M300 80 L200 120 V240 L300 300 L400 240 V120 Z" fill="#0a0a0a" stroke="#00ff00" stroke-width="3"/>
  
  <!-- Binary data on shield -->
  <text x="240" y="170" font-family="monospace" font-size="12" fill="#00ff00">01001100</text>
  <text x="240" y="190" font-family="monospace" font-size="12" fill="#00ff00">10110101</text>
  <text x="240" y="210" font-family="monospace" font-size="12" fill="#00ff00">01101100</text>
  <text x="240" y="230" font-family="monospace" font-size="12" fill="#00ff00">11010101</text>
  
  <!-- Flag (CTF symbol) -->
  <polygon points="400,120 400,170 360,150 400,130" fill="#ff3e3e"/>
  
  <!-- Lock icon (cybersecurity symbol) -->
  <rect x="275" y="210" width="50" height="40" rx="5" fill="#444"/>
  <rect x="285" y="190" width="30" height="25" rx="10" fill="none" stroke="#00ff00" stroke-width="3"/>
  
  <!-- w_11 text -->
  <text x="300" y="160" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">w_11</text>
  
  <!-- Tagline -->
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="20" fill="#00ff00" text-anchor="middle">CYBERSECURITY | CTF PLAYER</text>
</svg>
